name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm test
          NEXT_PUBLIC_SITE_URL=https://www.jingyuanxia.com npm run build

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          tar --exclude=.git --exclude=.github --exclude=.next --exclude=node_modules -czf "/tmp/jingyuanxia-${GITHUB_SHA}.tgz" .
          scp -i ~/.ssh/deploy_key "/tmp/jingyuanxia-${GITHUB_SHA}.tgz" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/jingyuanxia-${GITHUB_SHA}.tgz"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_ID='$RELEASE_ID' bash -s" < scripts/deploy-remote.sh

      - name: Verify production
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://www.jingyuanxia.com/ >/dev/null
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://www.jingyuanxia.com/zh >/dev/null
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://www.jingyuanxia.com/en >/dev/null
          for slug in tonight-wish-card petsona global-top-star loom living-chronicles; do
            curl --fail --location --retry 5 --retry-delay 3 --max-time 30 "https://www.jingyuanxia.com/zh/projects/${slug}" >/dev/null
            curl --fail --location --retry 5 --retry-delay 3 --max-time 30 "https://www.jingyuanxia.com/en/projects/${slug}" >/dev/null
          done
          for asset in \
            documents/projects/petsona.pdf \
            documents/projects/global-top-star.pdf \
            documents/projects/loom.pdf \
            documents/projects/living-chronicles.pdf \
            videos/projects/tonight-wish-card/product-demo.mp4 \
            videos/projects/loom/demo.mp4; do
            curl --fail --silent --show-error --range 0-1023 --retry 5 --retry-delay 3 --max-time 30 "https://www.jingyuanxia.com/${asset}" >/dev/null
          done
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://www.jingyuanxia.com/robots.txt >/dev/null
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://www.jingyuanxia.com/sitemap.xml >/dev/null
